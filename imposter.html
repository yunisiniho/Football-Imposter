<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imposter Ball</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg:       #060d1f;
            --card:     #0b1730;
            --surface:  #172a50;
            --border:   #1e3a6e;
            --text:     #eef2ff;
            --muted:    #6b8fc2;
            --blue:     #4f8ef7;
            --purple:   #a78bfa;
            --red:      #f43f5e;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            background-image: repeating-linear-gradient(
                0deg,
                transparent, transparent 70px,
                rgba(255,255,255,0.012) 70px,
                rgba(255,255,255,0.012) 140px
            );
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        /* ── Card ── */
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 1.75rem;
            box-shadow:
                0 40px 80px -16px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.06);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* ── Typography ── */
        h1 {
            font-weight: 900;
            font-size: 2.6rem;
            letter-spacing: -2.5px;
            line-height: 0.95;
            margin: 0 0 0.3rem;
            background: linear-gradient(140deg, var(--blue) 20%, var(--purple) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            margin: 0 0 2rem;
        }
        h2 {
            margin: 0 0 0.6rem;
            font-size: 1.4rem;
            font-weight: 800;
        }
        p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        /* ── Buttons ── */
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), #2d6be4);
            color: #fff;
            box-shadow: 0 6px 24px rgba(79,142,247,0.4);
        }
        .btn-primary:active { box-shadow: 0 2px 8px rgba(79,142,247,0.25); }
        .btn-danger  { background: var(--red); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--muted);
        }

        /* ── Swipeable Selector ── */
        .selectors-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.75rem;
        }
        .sel-group { flex: 1; }
        .sel-label {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }
        .sel-wrap {
            position: relative;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 1rem;
            height: 56px;
            overflow: hidden;
        }
        /* Fades to blend edges */
        .sel-fade {
            position: absolute;
            top: 0; bottom: 0;
            width: 34%;
            z-index: 2;
            pointer-events: none;
        }
        .sel-fade-l { left:  0; background: linear-gradient(to right, var(--bg), transparent); }
        .sel-fade-r { right: 0; background: linear-gradient(to left,  var(--bg), transparent); }
        /* Center highlight box */
        .sel-center {
            position: absolute;
            inset: 10% 33.33%;
            background: rgba(79,142,247,0.1);
            border: 1.5px solid rgba(79,142,247,0.35);
            border-radius: 0.55rem;
            pointer-events: none;
            z-index: 1;
        }
        .swipe-sel {
            display: flex;
            align-items: center;
            height: 100%;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .swipe-sel::-webkit-scrollbar { display: none; }
        .swipe-item {
            flex: 0 0 33.33%;
            scroll-snap-align: center;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            user-select: none;
        }
        .swipe-item.pad { visibility: hidden; pointer-events: none; }

        /* ── Role Card ── */
        .role-card {
            background: var(--bg);
            border-radius: 1.25rem;
            padding: 1.75rem;
            margin: 0.75rem 0;
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: transform 0.12s;
        }
        .role-card:active { transform: scale(0.98); }

        /* ── Timer ── */
        .timer-display {
            font-variant-numeric: tabular-nums;
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1;
            margin: 0.4rem 0 1.1rem;
        }

        /* ── Stat boxes ── */
        .stat-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .stat-box {
            flex: 1;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 1rem;
            padding: 0.75rem;
        }
        .stat-val   { font-size: 1.75rem; font-weight: 900; }
        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        /* ── Falling Footballs ── */
        .football-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .falling-ball {
            position: absolute;
            top: -10vh;
            opacity: 0.18;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* ── Animations ── */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Disguise Mode ── */
        #disguise-btn {
            position: fixed;
            top: 14px; left: 14px;
            z-index: 9999;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            width: 38px; height: 38px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background 0.2s;
        }
        #disguise-btn:hover { background: rgba(255,255,255,0.14); }
        #disguise-layer {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9998;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
            display: none;
        }
        #disguise-layer.active { display: block; }
        .paper-sheet {
            background: white;
            max-width: 800px;
            margin: 40px auto;
            padding: 60px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            min-height: 100vh;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
            color: #000;
        }
        .paper-sheet h1 {
            font-size: 2.5rem; color: #000;
            border-bottom: 3px solid #000;
            padding-bottom: 10px; margin-bottom: 10px;
            background: none; -webkit-text-fill-color: initial; text-align: left;
        }
        .paper-sheet h2 {
            font-size: 1.5rem; color: #444; margin: 0 0 30px;
            font-weight: normal; font-style: italic; text-align: left;
        }
        .paper-sheet h3 {
            font-size: 1.25rem; font-weight: bold;
            margin: 30px 0 15px; color: #000;
            border-bottom: 1px solid #ddd; padding-bottom: 5px;
        }
        .paper-sheet p {
            font-size: 1.1rem; line-height: 1.6;
            color: #222; margin-bottom: 1rem; text-align: left;
        }
        .paper-sheet strong { color: #000; }
    </style>
</head>
<body>
    <button id="disguise-btn" onclick="toggleDisguise()">🎓</button>
    <div id="disguise-layer"><div class="paper-sheet"></div></div>
    <div class="app-container" id="app"></div>

    <script>document.write('<script src="categories.js?v=' + Date.now() + '"><\/script>');</script>
    <script>
        const app = document.getElementById('app');

        // ── State ──
        let state = {
            players:  4,
            imposters: 1,
            usedWords: [],
            playerSpecificHints: {},
            currentRoles: [],
            currentPlayerIndex: 0,
            currentWord: '',
            startPlayerIndex: 0,
            timerInterval: null,
            secondsLeft: 0
        };

        // ── Screens ──
        const Screens = {
            Setup: () => {
                clearInterval(state.timerInterval);
                return `
                <div class="card fade-in">
                    <h1>IMPOSTER<br>BALL</h1>
                    <p class="tagline">Spot the football imposter</p>

                    <div class="selectors-row">
                        <div class="sel-group">
                            <span class="sel-label">Players</span>
                            ${Screens._selector('players-sel', 3, 15, state.players)}
                        </div>
                        <div class="sel-group">
                            <span class="sel-label">Imposters</span>
                            ${Screens._selector('imposters-sel', 1, 3, state.imposters)}
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="Actions.startGame()">Kick Off ⚽</button>
                    <div style="margin-top:1.1rem;font-size:0.78rem;color:var(--muted);cursor:pointer;opacity:0.65;"
                         onclick="Actions.resetSession(this)">Reset Word History</div>
                </div>`;
            },

            _selector: (id, min, max, val) => {
                let html = '<div class="swipe-item pad"></div>';
                for (let i = min; i <= max; i++)
                    html += `<div class="swipe-item" data-val="${i}">${i}</div>`;
                html += '<div class="swipe-item pad"></div>';
                return `
                <div class="sel-wrap">
                    <div class="sel-fade sel-fade-l"></div>
                    <div class="sel-center"></div>
                    <div class="sel-fade sel-fade-r"></div>
                    <div class="swipe-sel" id="${id}">${html}</div>
                </div>`;
            },

            PassDevice: () => `
                <div class="card fade-in">
                    <h2>Player ${state.currentPlayerIndex + 1}</h2>
                    <p>Pass the device secretly.</p>
                    <div style="font-size:5rem;margin:1.5rem 0;">🤫</div>
                    <button class="btn btn-primary" onclick="Actions.revealRole()">Tap to Reveal</button>
                </div>`,

            Reveal: (role, info) => {
                const isImp = role === 'Imposter';
                const color = isImp ? 'var(--red)' : 'var(--blue)';
                return `
                <div class="card fade-in">
                    <p style="font-size:0.78rem;margin-bottom:0.4rem;opacity:0.5;">Tap card to continue</p>
                    <div class="role-card" onclick="Actions.nextPlayer()">
                        <div style="font-size:3rem;margin-bottom:0.5rem;">${isImp ? '🎭' : '👕'}</div>
                        <h2 style="color:${color};font-size:1.55rem;text-transform:uppercase;margin-bottom:1rem;">${role}</h2>
                        <div style="border-top:1px solid var(--border);padding-top:1rem;">
                            <div class="stat-label">${isImp ? 'Your Hint' : 'Secret Word'}</div>
                            <div style="font-size:1.85rem;font-weight:900;margin-top:0.2rem;">${info}</div>
                        </div>
                    </div>
                    <button class="btn btn-outline" onclick="Actions.nextPlayer()">Hide &amp; Pass</button>
                </div>`;
            },

            GameActive: () => `
                <div class="card fade-in">
                    <div class="stat-label">Game in Progress</div>
                    <div class="timer-display" id="timer">05:00</div>
                    <div style="background:var(--surface);padding:0.85rem 1rem;border-radius:1rem;margin-bottom:1.25rem;font-size:0.9rem;">
                        <span style="font-size:1.2rem;">👉</span>
                        <strong>Player ${state.startPlayerIndex + 1}</strong> asks first.
                    </div>
                    <div class="stat-row">
                        <div class="stat-box">
                            <div class="stat-val">${state.imposters}</div>
                            <div class="stat-label">Imposters</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-val">${state.players}</div>
                            <div class="stat-label">Players</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="Actions.startGame()">Play Again</button>
                    <button class="btn btn-danger"  onclick="Actions.resetGame()">End Game</button>
                </div>`
        };

        // ── Actions ──
        const Actions = {
            init: () => {
                app.innerHTML = Screens.Setup();
                Actions.startFootballEffect();
                Actions.initSelectors();
            },

            initSelectors: () => {
                Actions.initSelector('players-sel',  'players',  state.players);
                Actions.initSelector('imposters-sel','imposters',state.imposters);
            },

            initSelector: (id, key, value) => {
                const sel = document.getElementById(id);
                if (!sel) return;
                const items = [...sel.querySelectorAll('.swipe-item:not(.pad)')];

                // Scroll to initial position after layout
                requestAnimationFrame(() => {
                    const w = sel.offsetWidth / 3;
                    const t = items.find(i => +i.dataset.val === value);
                    if (t) sel.scrollLeft = t.offsetLeft - w;
                });

                let timer;
                sel.addEventListener('scroll', () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        const cx = sel.scrollLeft + sel.offsetWidth / 2;
                        let best = null, bestD = Infinity;
                        items.forEach(item => {
                            const d = Math.abs(item.offsetLeft + item.offsetWidth / 2 - cx);
                            if (d < bestD) { bestD = d; best = item; }
                        });
                        if (!best) return;
                        state[key] = +best.dataset.val;

                        // Enforce imposters < players
                        if (key === 'players' && state.imposters >= state.players) {
                            state.imposters = state.players - 1;
                            const impSel = document.getElementById('imposters-sel');
                            if (impSel) {
                                const impItems = [...impSel.querySelectorAll('.swipe-item:not(.pad)')];
                                const impTarget = impItems.find(i => +i.dataset.val === state.imposters);
                                if (impTarget)
                                    impSel.scrollTo({ left: impTarget.offsetLeft - impSel.offsetWidth / 3, behavior: 'smooth' });
                            }
                        }
                    }, 80);
                }, { passive: true });
            },

            startFootballEffect: () => {
                if (document.getElementById('football-bg')) return;
                const c = document.createElement('div');
                c.id = 'football-bg';
                c.className = 'football-bg';
                document.body.appendChild(c);
                for (let i = 0; i < 14; i++) {
                    const b = document.createElement('div');
                    b.textContent = '⚽';
                    b.className = 'falling-ball';
                    b.style.cssText = `left:${Math.random()*100}vw;` +
                        `animation-duration:${(Math.random()*6+5).toFixed(1)}s;` +
                        `animation-delay:${(Math.random()*7).toFixed(1)}s;` +
                        `font-size:${(Math.random()*1.2+0.7).toFixed(1)}rem;`;
                    c.appendChild(b);
                }
            },

            resetSession: (el) => {
                state.usedWords = [];
                const orig = el.textContent;
                el.textContent = 'History Cleared!';
                setTimeout(() => el.textContent = orig, 1500);
            },

            startGame: () => {
                clearInterval(state.timerInterval);
                if (state.imposters >= state.players) { alert('Too many imposters!'); return; }

                // Assign roles
                state.currentRoles = Array(state.players).fill('Crewmate');
                let n = 0;
                while (n < state.imposters) {
                    const i = Math.floor(Math.random() * state.players);
                    if (state.currentRoles[i] === 'Crewmate') { state.currentRoles[i] = 'Imposter'; n++; }
                }

                // Pick word
                const pool = [
                    ...categories.footballers,
                    ...categories.footballTeams,
                    ...categories.footballGoals,
                    ...categories.footballPositions
                ];
                let avail = pool.filter(p => !state.usedWords.includes(p.word));
                if (!avail.length) { state.usedWords = []; avail = pool; }

                const pick = avail[Math.floor(Math.random() * avail.length)];
                state.usedWords.push(pick.word);
                state.currentWord = pick.word;

                // Give each imposter one hint (rotated)
                state.playerSpecificHints = {};
                const imposterIdxs = state.currentRoles
                    .map((r, i) => r === 'Imposter' ? i : -1)
                    .filter(i => i !== -1);
                const hints = [...pick.hints].sort(() => 0.5 - Math.random());
                imposterIdxs.forEach((idx, i) => {
                    state.playerSpecificHints[idx] = hints[i % hints.length];
                });

                state.startPlayerIndex = Math.floor(Math.random() * state.players);
                state.currentPlayerIndex = 0;
                app.innerHTML = Screens.PassDevice();
            },

            revealRole: () => {
                const role = state.currentRoles[state.currentPlayerIndex];
                const info = role === 'Crewmate'
                    ? state.currentWord
                    : state.playerSpecificHints[state.currentPlayerIndex];
                app.innerHTML = Screens.Reveal(role, info);
            },

            nextPlayer: () => {
                state.currentPlayerIndex++;
                if (state.currentPlayerIndex >= state.players) {
                    Actions.runTimer();
                } else {
                    app.innerHTML = Screens.PassDevice();
                }
            },

            runTimer: () => {
                state.secondsLeft = 5 * 60;
                app.innerHTML = Screens.GameActive();
                state.timerInterval = setInterval(() => {
                    state.secondsLeft--;
                    const m = String(Math.floor(state.secondsLeft / 60)).padStart(2, '0');
                    const s = String(state.secondsLeft % 60).padStart(2, '0');
                    const el = document.getElementById('timer');
                    if (el) el.textContent = `${m}:${s}`;
                    if (state.secondsLeft <= 0) {
                        clearInterval(state.timerInterval);
                        if (el) el.style.color = 'var(--red)';
                    }
                }, 1000);
            },

            resetGame: () => {
                clearInterval(state.timerInterval);
                Actions.init();
            }
        };

        // ── Disguise Mode ──
        const disguiseTopics = [{
            title: "A-Level Mathematics: Pure 4 - Advanced Integration & Differential Equations",
            topic: "Integration Techniques and Modelling",
            content: `
                <h3>1. Integration by Substitution</h3>
                <p>When a function is in the form $f(g(x))g'(x)$, we use $u = g(x)$. Remember to change the limits of the integral and substitute $dx$ for $du$. For example, to integrate $\\int x\\sqrt{x^2+1}\\,dx$, let $u = x^2+1$, then $du/dx = 2x$.</p>
                <h3>2. Integration by Parts</h3>
                <p>Derived from the product rule: $\\int u\\,\\frac{dv}{dx}\\,dx = uv - \\int v\\,\\frac{du}{dx}\\,dx$. Use the <strong>LATE</strong> rule to choose $u$ (Logs, Algebra, Trig, Exponentials).</p>
                <h3>3. First-Order Differential Equations</h3>
                <p>Equations in the form $\\frac{dy}{dx} = g(x)h(y)$ can be solved by <strong>Separation of Variables</strong>. Always add '+C' before applying boundary conditions to find a <strong>Particular Solution</strong>.</p>
                <p>Applications involve exponential growth and decay: $\\frac{dP}{dt} = kP$ integrates to $P = Ae^{kt}$.</p>`
        }];

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                const now = Date.now();
                if (now - lastEscTime < 500) toggleDisguise();
                lastEscTime = now;
            }
        });

        function toggleDisguise() {
            const layer = document.getElementById('disguise-layer');
            const btn   = document.getElementById('disguise-btn');
            const active = layer.classList.toggle('active');
            if (active) {
                const t = disguiseTopics[Math.floor(Math.random() * disguiseTopics.length)];
                layer.children[0].innerHTML = `<h1>${t.title}</h1><h2>Topic: ${t.topic}</h2>${t.content}`;
                document.title   = t.title.split(':')[0];
                btn.textContent  = '❌';
                btn.style.cssText = 'color:#333;background:rgba(0,0,0,0.08);';
            } else {
                document.title   = 'Imposter Ball';
                btn.textContent  = '🎓';
                btn.style.cssText = '';
            }
        }

        Actions.init();
    </script>
</body>
</html>
